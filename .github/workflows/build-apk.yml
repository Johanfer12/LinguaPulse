name: Build LinguaPulse APK

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linguapulse-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar y publicar LinguaPulse
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Preparar keystore de firma estable
        id: keystore
        run: |
          if [ ! -f signing/linguapulse-beta.jks ]; then
            echo "Generando keystore de beta por primera vez..."
            mkdir -p signing
            keytool -genkeypair -v \
              -keystore signing/linguapulse-beta.jks \
              -storetype JKS \
              -alias linguapulse \
              -keyalg RSA -keysize 2048 -validity 10950 \
              -storepass linguapulse -keypass linguapulse \
              -dname "CN=LinguaPulse Beta, OU=LinguaPulse, O=Antigravity, L=Bogota, C=CO"
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "Keystore ya versionado, se reutiliza."
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Versionar keystore recien creado
        if: steps.keystore.outputs.created == 'true' && github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f signing/linguapulse-beta.jks
          git commit -m "chore(ci): agregar keystore estable de firma beta [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

      - name: Dar permisos al wrapper
        run: chmod +x gradlew

      - name: Compilar APK de release optimizado
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Leer version generada
        id: version
        run: |
          VERSION_NAME="1.1.0-beta.${{ github.run_number }}"
          VERSION_CODE=$(( 1000 + ${{ github.run_number }} ))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Preparar artefactos de publicacion
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/LinguaPulse-${{ steps.version.outputs.name }}.apk"
          COMMIT_MSG=$(git log -1 --pretty=%s | sed 's/"/\\"/g')
          cat > dist/update.json <<JSON
          {
            "versionCode": ${{ steps.version.outputs.code }},
            "versionName": "${{ steps.version.outputs.name }}",
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.name }}/LinguaPulse-${{ steps.version.outputs.name }}.apk",
            "notes": "$COMMIT_MSG",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          JSON
          cat dist/update.json

      - name: Subir APK como artefacto de la ejecucion
        uses: actions/upload-artifact@v4
        with:
          name: LinguaPulse-APK
          path: dist/*
          retention-days: 30

      - name: Publicar release (actualizacion automatica de la app)
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: LinguaPulse ${{ steps.version.outputs.name }}
          body: |
            Build automatica de LinguaPulse en beta.

            - versionName: `${{ steps.version.outputs.name }}`
            - versionCode: `${{ steps.version.outputs.code }}`
            - commit: ${{ github.sha }}

            La app detecta esta version automaticamente desde Ajustes -> Actualizaciones.
          # Debe ser false: GitHub nunca marca un prerelease como "latest",
          # y la app consulta releases/latest/download/update.json.
          prerelease: false
          make_latest: true
          files: |
            dist/LinguaPulse-${{ steps.version.outputs.name }}.apk
            dist/update.json
